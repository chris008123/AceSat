[project]
name = "ai-agents"
version = "0.1.0"
description = "AceMentor AI — AI Agent Engineer module (agent contracts, prompts, orchestration)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "groq>=0.11",
]

# ai-data is NOT listed as a dependency above, same reasoning as
# backend/pyproject.toml: pip requires an absolute file:// URI for a local
# path dependency, which breaks portability across machines/clones. Install
# it as a separate explicit step instead — see "Running tests" in README.md.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ai_agents*"]
